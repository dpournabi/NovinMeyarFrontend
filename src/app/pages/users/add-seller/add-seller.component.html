<div class="ant-advanced-form modal-content" dir="rtl">
    <form class="w-100" nz-form [formGroup]="addSellerForm">
        <div class="d-flex flex-wrap">
            <div class="col-12 col-md-6 d-flex flex-column px-2">
                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>نام شرکت</nz-form-label>
                    <nz-form-control nzHasFeedback nzErrorTip="نام شرکت الزامی می باشد">
                      <input nz-input formControlName="name" class="novin-input-style" autofocus  maxlength="50" required/>
                      <span class="d-block position-absolute pt-3 text-danger top-0 star-required-style"
                                *ngIf="addSellerForm.controls['name'].invalid">*</span>
                    </nz-form-control>
                </nz-form-item>
                <nz-form-item  class="d-flex flex-column mt-4">
                        <nz-form-label>شماره ثبت</nz-form-label>
                        <nz-form-control nzHasFeedback nzErrorTip="شماره ثبت الزامی می باشد">
                          <input nz-input formControlName="registrationNo" class="novin-input-style" maxlength="7" required/>
                          <span class="d-block position-absolute pt-3 text-danger top-0 star-required-style"
                                    *ngIf="addSellerForm.controls['registrationNo'].invalid">*</span>
                        </nz-form-control>
                </nz-form-item>
                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>تلفن ثابت</nz-form-label>
                    <nz-form-control nzHasFeedback nzErrorTip="فرمت شماره صحیح نمی باشد">
                      <input nz-input formControlName="tellPhone" class="novin-input-style" pattern="^0\d{2}\d{8}$" maxlength="11" placeholder="02133000000" required/>
                      <span class="d-block position-absolute pt-3 text-danger top-0 star-required-style"
                                *ngIf="addSellerForm.controls['tellPhone'].invalid">*</span>
                    </nz-form-control>
                </nz-form-item>
                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>نام خانوادگی مدیرعامل</nz-form-label>
                    <nz-form-control>
                      <input nz-input formControlName="ctoLastName" class="novin-input-style"  maxlength="20"/>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>تاریخ تولد مدیرعامل</nz-form-label>
                    <nz-form-control>
                        <dp-date-picker formControlName="ctoBirthDate" dir="rtl" theme="dp-material"
                            class="ant-input" [config]="datePickerConfig">
                        </dp-date-picker>
                    </nz-form-control>
                </nz-form-item>
            </div>


            <div class="col-12 col-md-6 d-flex flex-column px-2">
                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>کداقتصادی</nz-form-label>
                    <nz-form-control nzHasFeedback nzErrorTip="کداقتصادی الزامی می باشد">
                      <input nz-input formControlName="economicCode" class="novin-input-style"  maxlength="12" required/>
                      <span class="d-block position-absolute pt-3 text-danger top-0 star-required-style"
                                *ngIf="addSellerForm.controls['economicCode'].invalid">*</span>
                    </nz-form-control>
                </nz-form-item>
                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>شناسه ملی</nz-form-label>
                    <nz-form-control nzHasFeedback nzErrorTip="شناسه ملی الزامی می باشد">
                      <input nz-input formControlName="nationalNo" class="novin-input-style"  maxlength="11" required/>
                      <span class="d-block position-absolute pt-3 text-danger top-0 star-required-style"
                                *ngIf="addSellerForm.controls['nationalNo'].invalid">*</span>
                    </nz-form-control>
                </nz-form-item>
                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>نام مدیرعامل</nz-form-label>
                    <nz-form-control>
                      <input nz-input formControlName="ctoFirstName" class="novin-input-style"  maxlength="20"/>
                    </nz-form-control>
                </nz-form-item>
                <nz-form-item class="d-flex flex-column mt-4">
                    <nz-form-label>همراه مدیرعامل</nz-form-label>
                    <nz-form-control>
                      <input nz-input formControlName="ctoCell" class="novin-input-style"  maxlength="11" placeholder="09128888888" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item class="d-flex flex-column  mt-4">
                    <nz-form-label>آدرس</nz-form-label>
                    <nz-form-control>
                      <textarea nz-input formControlName="address" class="novin-input-style"  maxlength="200">

                      </textarea>
                    </nz-form-control>
                </nz-form-item>
            </div>
          
        </div>
        <div class="col-12 col-md-12 d-flex flex-column px-2 mt-4">
            <nz-form-item class="d-flex flex-column">
                <nz-form-label>تصویر پروانه طراحی و مونتاژ</nz-form-label>
                <nz-form-control nzHasFeedback nzErrorTip="بارگذاری تصویر پروانه طراحی و مونتاژ الزامی می باشد">
                    <div [attr.style]="'width:'+ designCertificatePercent+'%'" [ngClass]="{complete: designCertificatePercent>=100}"
                        class="upload-progress position-absolute"></div>
                    <input type="file" style="min-width: 100% !important;" nz-input id="designCertificateDocument" [nzBorderless]="editDisabled"
                        (change)="uploadCertificates($event,'designingCertificateId')">
                        <span class="d-block position-absolute pt-3 text-danger top-0 star-required-style"
                        *ngIf="addSellerForm.controls['designingCertificateId'].invalid">*</span>

                    <i nz-icon nzType="eye" *ngIf="addSellerForm.controls.designingCertificateId.value > 0"
                        (click)="download('designingCertificateId')" class="file-view" nzTheme="outline"></i>
                    <i nz-icon nzType="delete" class="file-delete"
                        *ngIf="addSellerForm.controls.designingCertificateId.value > 0"
                        (click)="deleteFile('designingCertificateId')" nzTheme="outline"></i>
                </nz-form-control>
            </nz-form-item>
        </div>

        <div class="col-12 col-md-12 d-flex flex-column px-2 mt-4">
            <nz-form-item class="d-flex flex-column">
                <nz-form-label>تصویر استعلام اداره ثبت(<a style="color: blue;" href="https://ilenc.ssaa.ir" target="_blank">محل دریافت</a>)</nz-form-label>
                <nz-form-control nzHasFeedback nzErrorTip="بارگذاری تصویر استعلام اداره ثبت الزامی می باشد">
                    <div [attr.style]="'width:'+ officeCertificatePercent+'%'" [ngClass]="{complete: officeCertificatePercent>=100}"
                        class="upload-progress position-absolute"></div>
                    <input type="file" nz-input id="officeCertificateDocument" [nzBorderless]="editDisabled"
                    (change)="uploadCertificates($event,'registrationOfficeCertificate')">

                    <i nz-icon nzType="eye" class="file-view"
                        *ngIf="addSellerForm.controls.registrationOfficeCertificate.value > 0"
                        (click)="download('registrationOfficeCertificate')" nzTheme="outline">
                    </i>
                    <i nz-icon nzType="delete" class="file-delete"
                        *ngIf="addSellerForm.controls.registrationOfficeCertificate.value > 0"
                        (click)="deleteFile('registrationOfficeCertificate')" nzTheme="outline"></i>
                </nz-form-control>
                
            </nz-form-item>
        </div>

        <div class="col-12 mt-4" style="text-align: left; padding:0.5rem 0 0 1rem;">
            <button  nz-button nzType="primary" [nzLoading]="loaded" *ngIf="router.url === '/users/profile'" (click)='edit_UserProfile()'>
              ذخیره
            </button>
        </div>

    </form>
</div>
